<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Cell Explorer</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="scene.css">
<body><main id="sceneLab"><h1 class="scene-title">3D Cell Explorer</h1>
<div class="scene-grid"><section class="scene-view" aria-label="Cell model">
<svg viewBox="0 0 480 340" tabindex="0" role="img" aria-label="A simplified 3D cell. Drag or use arrow keys to rotate."></svg>
<div class="scene-buttons"><button class="btn" id="left" type="button">Rotate left</button><button class="btn" id="right" type="button">Rotate right</button><button class="btn" id="resetView" type="button">Reset view</button></div>
</section><section class="scene-panel" aria-label="Compare cell structures">
<h2>Compare cells</h2><label for="cellType">Cell model</label><select id="cellType"><option value="plant">Plant leaf cell</option><option value="animal">Animal cell</option></select>
<label for="part">Highlight a structure</label><select id="part"></select><p id="cellFact" role="status"></p>
<p>Colours, shapes, counts and sizes are simplified. The see-through outline lets you look inside; these are not microscope images.</p>
<fieldset><legend>Quick challenge</legend><label for="cellAnswer">Which structure helps a leaf cell use light to make sugars?</label><select id="cellAnswer"><option value="">Pick an answer</option><option>Nucleus</option><option>Chloroplast</option><option>Cell membrane</option></select><button class="btn primary" type="button" id="checkCell">Check</button><p id="cellFeedback" role="status"></p></fieldset>
</section></div></main><noscript>Enable JavaScript to explore the cells.</noscript>
<script src="lab.js"></script><script src="3d.js"></script><script src="cell.js"></script></body></html>
