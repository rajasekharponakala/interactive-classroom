<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compass and Straightedge Lab</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/lab.css">
<link rel="stylesheet" href="scene.css">
<style>
:root { --accent: var(--violet); --accent-soft: var(--violet-soft); }
body { display:block; height:auto; }
.scene-view svg { touch-action:auto; cursor:default; }
.scene-view text { fill:var(--ink); stroke:var(--sky-soft); stroke-width:4; paint-order:stroke; font:800 18px system-ui,sans-serif; }
.scene-panel output { font-weight:800; }
</style>
</head>
<body>
<main id="sceneLab">
  <h1 class="scene-title">Compass and Straightedge Lab</h1>
  <div class="scene-grid">
    <section class="scene-view" aria-label="Construction drawing">
      <svg viewBox="0 0 440 340" role="img" aria-labelledby="diagramTitle"><title id="diagramTitle">Compass and straightedge construction</title><g id="drawing"></g></svg>
      <div class="scene-buttons"><button class="btn" id="back" type="button">Back</button><button class="btn primary" id="next" type="button">Next step</button><button class="btn" id="reset" type="button">Reset</button></div>
      <p id="instructions" role="status"></p>
    </section>
    <section class="scene-panel" aria-label="Construction settings">
      <h2>Choose a construction</h2>
      <label for="construction">What will you draw?</label>
      <select id="construction"><option value="bisector">Perpendicular bisector</option><option value="triangle">Triangle from three sides</option></select>
      <p>The starting segment AB is 6 cm in the model.</p>
      <label for="radiusA" id="labelA">Compass opening</label>
      <input id="radiusA" type="range" min="2" max="7" step="0.5" value="4"><output id="valueA" for="radiusA"></output>
      <div id="radiusBGroup" hidden>
        <label for="radiusB">Compass opening at B (BC)</label>
        <input id="radiusB" type="range" min="2" max="7" step="0.5" value="5"><output id="valueB" for="radiusB"></output>
      </div>
      <p class="read" id="result"></p>
      <div id="attempts"></div>
    </section>
  </div>
  <section id="quiz" data-quiz-id="constructions"></section>
</main>
<script src="lab.js"></script><script src="constructions.js"></script>
<script src="../js/quiz-defs.js"></script><script src="../js/quiz.js"></script><script src="../js/attempts.js"></script>
<script>Quiz.mount(document.getElementById('quiz')); Attempts.mount(document.getElementById('attempts'), 'constructions');</script>
</body></html>
