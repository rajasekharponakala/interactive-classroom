<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens and Mirror Lab – Interactive Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/lab.css">
<style>:root { --accent: var(--teal); --accent-soft: var(--teal-soft); }</style>
</head>
<body>
<header class="lab-head"><h1>Lens and Mirror Lab</h1><span class="tag">Light</span></header>
<main class="lab">
  <div class="stage"><canvas id="cv" tabindex="0" aria-label="Ray diagram. Drag the object arrow left or right, or use the arrow keys."></canvas><span class="hint" id="hint">Drag the arrow</span></div>
  <div class="panel">
    <div class="box">
      <h2>Choose</h2>
      <div class="pill-group" id="kind" role="group" aria-label="Lens or mirror type">
        <button class="pill" data-v="cvl" aria-pressed="true" type="button">Convex lens</button>
        <button class="pill" data-v="ccl" aria-pressed="false" type="button">Concave lens</button>
        <button class="pill" data-v="ccm" aria-pressed="false" type="button">Concave mirror</button>
        <button class="pill" data-v="cvm" aria-pressed="false" type="button">Convex mirror</button>
      </div>
    </div>
    <div class="box">
      <h2>Change</h2>
      <div class="ctl"><label for="d">Object distance</label><output id="dOut"></output><input id="d" type="range" min="3" max="56" step="0.5" value="30"></div>
      <div class="ctl"><label for="f">Focal length</label><output id="fOut"></output><input id="f" type="range" min="6" max="24" step="1" value="12"></div>
      <div class="ctl"><label for="ho">Object height</label><output id="hoOut"></output><input id="ho" type="range" min="2" max="10" step="0.5" value="6"></div>
    </div>
    <div class="box">
      <h2>The image is</h2>
      <p id="nature" style="font-family:var(--display);font-size:22px;font-weight:700;line-height:1.2"></p>
      <div class="reads" style="margin-top:10px">
        <div class="read"><span>u (object)</span><b id="uR"></b></div>
        <div class="read"><span>v (image)</span><b id="vR"></b></div>
        <div class="read"><span>f</span><b id="fR"></b></div>
        <div class="read"><span>Magnification</span><b id="mR"></b></div>
      </div>
      <p class="note" id="formula" style="margin-top:8px"></p>
    </div>
  </div>
</main>
<script src="lab.js"></script>
<script>
(function () {
  const $ = (i) => document.getElementById(i), cv = $("cv");
  let kind = "cvl", d = 30, F = 12, ho = 6, drag = false;
  const dEl = $("d");
  let HALF = 60; // the stage shows -HALF cm to +HALF cm; narrower on small screens
  function solve() {
    const lens = kind.endsWith("l"), u = -d;
    const f = lens ? (kind === "cvl" ? F : -F) : (kind === "ccm" ? -F : F);
    const dd = Math.abs(d - F) < 0.02 ? d + 0.02 : d, uu = -dd; // avoid dividing by zero exactly at the focus
    const v = lens ? (f * uu) / (uu + f) : (f * uu) / (uu - f);
    const m = lens ? v / uu : -v / uu;
    const real = lens ? v > 0 : v < 0;
    return { lens, u, f, v, m, real, inf: Math.abs(v) > 2000 };
  }
  function update() {
    const s = solve();
    $("uR").textContent = s.u.toFixed(1) + " cm"; $("fR").textContent = (s.f > 0 ? "+" : "") + s.f.toFixed(0) + " cm";
    $("vR").textContent = s.inf ? "∞" : (s.v > 0 ? "+" : "") + s.v.toFixed(1) + " cm";
    $("mR").textContent = s.inf ? "–" : (s.m > 0 ? "+" : "") + s.m.toFixed(2);
    const size = Math.abs(s.m) > 1.03 ? "magnified" : Math.abs(s.m) < 0.97 ? "smaller" : "same size";
    $("nature").textContent = s.inf ? "At infinity – the rays come out parallel" : (s.real ? "Real" : "Virtual") + ", " + (s.m < 0 ? "upside down" : "upright") + ", " + size;
    $("formula").innerHTML = s.lens ? "Lens formula: <b>1/v − 1/u = 1/f</b>. Distances to the left of the lens are negative."
      : "Mirror formula: <b>1/v + 1/u = 1/f</b>. Distances in front of the mirror are negative.";
    draw();
  }
  function draw() {
    const { ctx, w, h } = Lab.fit(cv);
    const half = w < 520 ? 42 : 60;
    if (half !== HALF) { HALF = half; dEl.max = HALF - 4; if (d > HALF - 4) { setD(HALF - 4); return; } }
    const s = solve();
    const sc = w / (2 * HALF), cx = w / 2, cy = h / 2;
    const X = (x) => cx + x * sc, Y = (y) => cy - y * sc;
    const ink = Lab.css("--ink"), ink3 = Lab.css("--ink-3"), body = Lab.css("--body");
    ctx.clearRect(0, 0, w, h); ctx.lineCap = "round"; ctx.lineJoin = "round";
    // principal axis
    ctx.strokeStyle = ink3; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
    // lens or mirror
    const ap = Math.min(22, (h / 2 - 16) / sc);
    ctx.lineWidth = 3; ctx.strokeStyle = ink; ctx.fillStyle = Lab.css("--teal-soft");
    if (s.lens) {
      const b = kind === "cvl" ? 3.2 : -1.6, e = kind === "cvl" ? 0.3 : 2.4;
      ctx.beginPath(); ctx.moveTo(X(-e), Y(ap)); ctx.quadraticCurveTo(X(-e - 2 * b), cy, X(-e), Y(-ap)); ctx.lineTo(X(e), Y(-ap));
      ctx.quadraticCurveTo(X(e + 2 * b), cy, X(e), Y(ap)); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      const R = 2 * F, a = Math.min(ap, R * 0.85), sign = kind === "ccm" ? -1 : 1;
      ctx.lineWidth = 6; ctx.strokeStyle = Lab.css("--teal"); ctx.beginPath();
      for (let y = -a; y <= a + 1e-6; y += a / 24) { const x = sign * (R - Math.sqrt(R * R - y * y)); y === -a ? ctx.moveTo(X(x) + 4, Y(y)) : ctx.lineTo(X(x) + 4, Y(y)); }
      ctx.stroke(); ctx.lineWidth = 3; ctx.strokeStyle = ink; ctx.beginPath();
      for (let y = -a; y <= a + 1e-6; y += a / 24) { const x = sign * (R - Math.sqrt(R * R - y * y)); y === -a ? ctx.moveTo(X(x), Y(y)) : ctx.lineTo(X(x), Y(y)); }
      ctx.stroke();
    }
    // focus marks
    ctx.font = "800 13px " + body; ctx.textAlign = "center"; ctx.fillStyle = ink;
    const marks = s.lens ? [[F, "F"], [-F, "F"], [2 * F, "2F"], [-2 * F, "2F"]] : [[s.f, "F"], [2 * s.f, "C"]];
    marks.forEach(([x, t]) => { if (Math.abs(x) > HALF) return; ctx.beginPath(); ctx.arc(X(x), cy, 4, 0, 7); ctx.fill(); ctx.fillText(t, X(x), cy + 20); });
    // rays
    const T = [-d, ho], I = [s.v, s.m * ho];
    const rays = [[0, ho, "--coral"], [0, 0, "--violet"]];
    rays.forEach(([px, py, col]) => {
      ctx.strokeStyle = Lab.css(col); ctx.lineWidth = 2.5; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(X(T[0]), Y(T[1])); ctx.lineTo(X(px), Y(py)); ctx.stroke();
      let dx = s.real ? I[0] - px : px - I[0], dy = s.real ? I[1] - py : py - I[1];
      const l = Math.hypot(dx, dy) || 1;
      ctx.beginPath(); ctx.moveTo(X(px), Y(py)); ctx.lineTo(X(px + (dx / l) * 300), Y(py + (dy / l) * 300)); ctx.stroke();
      if (!s.real && !s.inf) { ctx.setLineDash([6, 7]); ctx.globalAlpha = 0.7; ctx.beginPath(); ctx.moveTo(X(px), Y(py)); ctx.lineTo(X(I[0]), Y(I[1])); ctx.stroke(); ctx.globalAlpha = 1; ctx.setLineDash([]); }
    });
    // object and image arrows
    arrow(X(T[0]), cy, Y(T[1]), Lab.css("--sun"), ink, 1, "Object");
    if (!s.inf && Math.abs(I[0]) < HALF * 1.6) arrow(X(I[0]), cy, Y(I[1]), Lab.css("--leaf"), ink, s.real ? 1 : 0.55, "Image");
    function arrow(x, y0, y1, fill, stroke, alpha, label) {
      const dir = y1 < y0 ? -1 : 1, hh = Math.min(16, Math.abs(y1 - y0) * 0.6);
      ctx.globalAlpha = alpha; ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = 2.5;
      const hw = Math.min(13, hh * 0.9), sw = Math.min(5, hw * 0.4);
      ctx.beginPath(); ctx.moveTo(x - sw, y0); ctx.lineTo(x - sw, y1 - dir * hh); ctx.lineTo(x - hw, y1 - dir * hh); ctx.lineTo(x, y1);
      ctx.lineTo(x + hw, y1 - dir * hh); ctx.lineTo(x + sw, y1 - dir * hh); ctx.lineTo(x + sw, y0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = stroke; ctx.font = "800 13px " + body;
      ctx.fillText(label, x, dir < 0 ? y0 + 36 : y0 - 26);
    }
  }
  Lab.pills("kind", (v) => { kind = v; update(); });
  Lab.bind("d", (v) => v.toFixed(1) + " cm", (v) => { d = v; update(); });
  Lab.bind("f", (v) => v + " cm", (v) => { F = v; update(); });
  Lab.bind("ho", (v) => v.toFixed(1) + " cm", (v) => { ho = v; update(); });
  function setD(v) { dEl.value = Math.max(3, Math.min(HALF - 4, v)); dEl.dispatchEvent(new Event("input")); }
  function fromPointer(e) { const r = cv.getBoundingClientRect(); setD(-((e.clientX - r.left - r.width / 2) / (r.width / (2 * HALF)))); }
  cv.addEventListener("pointerdown", (e) => { drag = true; cv.setPointerCapture(e.pointerId); $("hint").style.opacity = 0; fromPointer(e); });
  cv.addEventListener("pointermove", (e) => { if (drag) fromPointer(e); });
  cv.addEventListener("pointerup", () => (drag = false)); cv.addEventListener("pointercancel", () => (drag = false));
  cv.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") { setD(d + 1); e.preventDefault(); } if (e.key === "ArrowRight") { setD(d - 1); e.preventDefault(); } });
  update();
  new ResizeObserver(draw).observe(cv);
})();
</script>
</body>
</html>
